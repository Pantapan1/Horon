name: Build VoxelHorizon Native v4.1 APK (Kotlin + libGDX)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Organize flat repository into Android + libGDX layout
        run: |
          mkdir -p app/src/main/java/com/voxelhorizon/nativegame
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi

          cp -f app_build.gradle app/build.gradle
          cp -f AndroidManifest.xml app/src/main/AndroidManifest.xml

          # Kotlin sources
          for kt in *.kt; do
            [ -f "$kt" ] && cp -f "$kt" app/src/main/java/com/voxelhorizon/nativegame/
          done

          # Assets (textures, anime cover, font, stereo OST)
          for asset in anime_tiles.png cover_anime.jpg font.ttf ost_*.wav; do
            [ -f "$asset" ] && cp -f "$asset" app/src/main/assets/
          done

          # App icon
          if [ -f "icon.png" ]; then
            cp -f icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp -f icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp -f icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          fi

          printf "org.gradle.jvmargs=-Xmx3072m\nandroid.useAndroidX=false\n" > gradle.properties

      - name: Compile Native Kotlin + libGDX APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk VoxelHorizon-Native-v4.1.apk
          ls -lh VoxelHorizon-Native-v4.1.apk

      - name: Publish direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.1-native-latest
          name: VoxelHorizon Native v4.1 APK (Kotlin + OpenGL ES)
          files: VoxelHorizon-Native-v4.1.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
