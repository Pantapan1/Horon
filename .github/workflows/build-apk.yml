name: Build VoxelHorizon Rust Engine v6.5 APK (Mega Update)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rust-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Organize flat repository into Rust + Android layout
        run: |
          mkdir -p rust_core/src
          mkdir -p app/src/main/java/com/voxelhorizon/nativegame
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86_64
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi

          mv -f Cargo.toml rust_core/Cargo.toml
          printf "\n[workspace]\n" >> rust_core/Cargo.toml
          cp -f rust_lib.rs rust_core/src/lib.rs
          cp -f rust_noise.rs rust_core/src/noise.rs
          cp -f rust_world.rs rust_core/src/world.rs
          cp -f rust_mesher.rs rust_core/src/mesher.rs

          cp -f app_build.gradle app/build.gradle
          [ -f "voxelhorizon.jks" ] && cp -f voxelhorizon.jks app/voxelhorizon.jks
          cp -f AndroidManifest.xml app/src/main/AndroidManifest.xml

          # All Kotlin sources (explicit list v6.5)
          for kt in AndroidLauncher.kt PlatformBridge.kt ProfileManager.kt SoundFx.kt RedstoneSystem.kt RustEngine.kt BlockRegistry.kt SpriteArt.kt WorldIso.kt EntitiesIso.kt LuaModEngine.kt NetMultiplayer.kt VoxelHorizonGame.kt; do
            [ -f "$kt" ] && cp -f "$kt" app/src/main/java/com/voxelhorizon/nativegame/
          done

          # All PNG/JPG textures, Pixel UI, Pixel Font, SFX WAVs, and stereo OST
          for asset in anime_tiles.png anime_tiles_2.png anime_tiles_3.png anime_tiles_4.png anime_tiles_5.png anime_items.png anime_items_2.png anime_items_3.png anime_items_4.png anime_items_5.png sprites_heroes.png sprites_mobs.png sprites_props.png ui_pixel.png pixel_font.png pixel_font.fnt cover_anime.jpg font.ttf ost_*.wav sfx_*.wav; do
            [ -f "$asset" ] && cp -f "$asset" app/src/main/assets/
          done

          if [ -f "icon.png" ]; then
            cp -f icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp -f icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp -f icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          fi

          printf "org.gradle.jvmargs=-Xmx3072m\nandroid.useAndroidX=false\n" > gradle.properties

      - name: Compile Rust Native Engine (.so for ARM64 / ARMv7 / x86_64)
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* 2>/dev/null | sort -V | tail -n 1)}}"
          fi
          echo "Using ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          cd rust_core
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release
          ls -lh ../app/src/main/jniLibs/*/libvoxelhorizon_core.so

      - name: Compile Android APK with Rust Engine
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk VoxelHorizon-Rust-v6.5.apk
          ls -lh VoxelHorizon-Rust-v6.5.apk

      - name: Publish direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.5-rust-latest
          name: VoxelHorizon Rust Engine v6.5 APK (Mega Update)
          files: VoxelHorizon-Rust-v6.5.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
