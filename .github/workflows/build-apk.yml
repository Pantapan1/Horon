name: Build VoxelHorizon v3.0 APK (Rust-WASM + Studio)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust & wasm-pack
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install npm dependencies
        run: npm install

      - name: Prepare www bundle
        run: npm run prepare-www

      - name: Compile Rust-WASM Core (lib.rs -> www/vh_core.wasm)
        run: wasm-pack build --release --target web --out-dir www --out-name vh_core

      - name: Generate Android project via Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure App Icon, Landscape Fullscreen & Storage Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' "$MANIFEST"
          if [ -f "icon.png" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              cp -f icon.png "$dir/ic_launcher.png" || true
              cp -f icon.png "$dir/ic_launcher_round.png" || true
            done
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload VoxelHorizon v3.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: VoxelHorizon-v3.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
