name: Build VoxelHorizon v3.2 APK (Rust-WASM + Studio)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust & wasm-pack
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install npm dependencies
        run: npm install

      - name: Prepare www bundle
        run: npm run prepare-www

      - name: Compile Rust-WASM Core (lib.rs -> www/vh_core.wasm)
        run: |
          wasm-pack build --release --target web --out-dir www --out-name vh_core
          rm -f www/.gitignore www/package.json

      - name: Generate Android project via Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure App Icon & Landscape Fullscreen
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' "$MANIFEST"
          if [ -f "icon.png" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for dir in android/app/src/main/res/mipmap-*dpi; do
              rm -f "$dir/ic_launcher_foreground.png"
              cp -f icon.png "$dir/ic_launcher.png"
              cp -f icon.png "$dir/ic_launcher_round.png"
            done
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../VoxelHorizon-v3.2.apk

      - name: Publish direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.2-latest
          name: VoxelHorizon v3.2 APK
          files: VoxelHorizon-v3.2.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
